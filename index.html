<!DOCTYPE html>


<!-- div :  Tạo thành 1 khối -->
<html>
    <!--chú thích : Phần đầu-->
    <head>
          <title>WEB BÁN HÀNG</title>
          <meta charset="utf-8">   <!--định nghĩa tiếng việt-->
    </head>
    <!--Phần thân -->
    <body>
        Xin chào các bạn !
        <!--Tiêu đề : h1-h6 -->
        <h1>
            Mình là Trần Quang Đức ! 
        </h1>

        <!--input : kiểu dữ liệu nhập-->
        <input type="text">

        <!--button : nút -->
        <button>Đăng nhập</button>

        <!--p: dùng để viết đoạn văn-->
        <p> Mình quê Nam Định . 
            Sinh năm 2005
        </p>
        <!--
        img: ảnh
        src  : nguồn
        alt : Sd khi ảnh bị lỗi 
        -->
        <img src="https://images.pexels.com/photos/954710/pexels-photo-954710.jpeg?auto=compress&cs=tinysrgb&dpr=1&w=500" alt=""/>
        <!--a: mỏ neo ( đường chỉ dẫn ) -->
        <a href="https://github.com/">Chuyển tới trag Github</a>

        <!--ul, li : hiển thị danh sách -->
        <ul>
            <li>Quê quán </li>
            <li>Năm sinh</li>
            <li>Giới tính</li>
            <li>Trường</li>
        </ul>

        <!--table : Bảng-->
        <table>
            <thead>
                <!--tiêu đề bảng-->
                <th>STT</th>
                <th>Name</th>

            </thead>
            <tbody>
                <tr> <!--dòng-->
                    <td>1</td>
                    <td>Đức</td>
                </tr>

            </tbody>
        </table>
        <!--Thuộc tính : Attribute-->
        <h1 title="Đây là thuộc tính">Attribute?</h1>
    </body>
</html>
